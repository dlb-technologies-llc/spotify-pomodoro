services:
  app:
    build: .
    image: ghcr.io/dlb-technologies-llc/spotify-pomodoro:${IMAGE_TAG:-latest}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "${PORT:-2500}:${PORT:-2500}"
    volumes:
      - pomodoro_data:/app/data
    environment:
      - PUBLIC_SPOTIFY_CLIENT_ID=${PUBLIC_SPOTIFY_CLIENT_ID}
      - PUBLIC_SPOTIFY_REDIRECT_URI=${PUBLIC_SPOTIFY_REDIRECT_URI}
      - PORT=${PORT:-2500}
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - AUTH_SECRET=${AUTH_SECRET:-}
      - AUTH_USERS=${AUTH_USERS:-}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-24}
      - OTEL_COLLECTOR_URL=${OTEL_COLLECTOR_URL:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    restart: unless-stopped

volumes:
  pomodoro_data:
